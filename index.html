<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0c10;
    color: #e8e8ea;
    height: 100vh;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    background: #121319;
    border-right: 1px solid #22232c;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .brand { font-size: 16px; font-weight: 600; }
  .brand-sub { font-size: 12px; color: #71717a; margin-top: 2px; }

  .ingest-card {
    background: #1a1b23;
    border: 1px solid #22232c;
    border-radius: 10px;
    padding: 14px;
  }
  .ingest-card h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #71717a;
    margin-bottom: 10px;
  }
  .drop-zone {
    border: 1.5px dashed #33343f;
    border-radius: 8px;
    padding: 18px 10px;
    text-align: center;
    font-size: 12px;
    color: #71717a;
    cursor: pointer;
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .drop-zone:hover { border-color: #4f7cff; }
  .drop-zone.dragover { border-color: #4f7cff; background: #16181f; }
  .drop-zone .fname { color: #e8e8ea; font-weight: 500; margin-top: 4px; }
  input[type="file"] { display: none; }

  .btn {
    width: 100%;
    background: #4f7cff;
    color: white;
    border: none;
    padding: 9px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #3d68e6; }
  .btn:disabled { background: #24252f; color: #55565f; cursor: not-allowed; }

  .status { font-size: 11.5px; margin-top: 10px; line-height: 1.4; }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }
  .status.pending { color: #71717a; }

  .doc-list { margin-top: auto; font-size: 11px; color: #52535c; }

  /* Main chat */
  .main { flex: 1; display: flex; flex-direction: column; }
  .header {
    padding: 16px 24px;
    border-bottom: 1px solid #22232c;
    font-size: 13px;
    color: #71717a;
  }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: #52535c;
    font-size: 13px;
  }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .msg-row.user .bubble {
    background: #4f7cff;
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg-row.answer .bubble {
    background: #1a1b23;
    border: 1px solid #22232c;
    border-bottom-left-radius: 3px;
  }
  .sources {
    margin-top: 8px;
    font-size: 11px;
    color: #71717a;
    border-top: 1px solid #26272f;
    padding-top: 6px;
  }
  .dot-typing span {
    display: inline-block;
    width: 5px; height: 5px;
    background: #71717a;
    border-radius: 50%;
    margin-right: 3px;
    animation: blink 1.2s infinite;
  }
  .dot-typing span:nth-child(2) { animation-delay: 0.2s; }
  .dot-typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  .input-bar {
    padding: 16px 24px 22px;
    border-top: 1px solid #22232c;
    display: flex;
    gap: 10px;
  }
  .input-bar input {
    flex: 1;
    background: #1a1b23;
    border: 1px solid #26272f;
    color: #e8e8ea;
    padding: 12px 14px;
    border-radius: 9px;
    font-size: 14px;
  }
  .input-bar input:focus { outline: none; border-color: #4f7cff; }
  .send-btn {
    background: #4f7cff;
    border: none;
    color: white;
    width: 44px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 16px;
  }
  .send-btn:disabled { background: #24252f; cursor: not-allowed; }
</style>
</head>
<body>

<div class="sidebar">
  <div>
    <div class="brand">RAG Chat</div>
    <div class="brand-sub">Enterprise document Q&A</div>
  </div>

  <div class="ingest-card">
    <h3>Add Document</h3>
    <label class="drop-zone" id="dropZone">
      <div id="dropText">Click or drop a file<br>(.pdf .docx .txt .md)</div>
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md">
    </label>
    <button class="btn" id="ingestBtn" onclick="ingest()">Ingest</button>
    <div id="ingestStatus" class="status"></div>
  </div>

  <div class="doc-list">Documents ingested this session are searchable immediately.</div>
</div>

<div class="main">
  <div class="header">Ask questions about your ingested documents</div>
  <div class="chat-log" id="chatLog">
    <div class="empty-state" id="emptyState">No messages yet — ingest a document, then ask a question.</div>
  </div>
  <div class="input-bar">
    <input id="queryInput" type="text" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') query()">
    <button class="send-btn" id="queryBtn" onclick="query()">→</button>
  </div>
</div>

<script>
const API_BASE = "https://rag-chat-jjkl.onrender.com";

const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const dropText = document.getElementById('dropText');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) {
    fileInput.files = e.dataTransfer.files;
    updateFileName();
  }
});
fileInput.addEventListener('change', updateFileName);

function updateFileName() {
  if (fileInput.files.length) {
    dropText.innerHTML = `<div class="fname">${escapeHtml(fileInput.files[0].name)}</div>`;
  }
}

async function ingest() {
  const status = document.getElementById('ingestStatus');
  const btn = document.getElementById('ingestBtn');

  if (!fileInput.files.length) {
    status.textContent = 'Choose a file first.';
    status.className = 'status err';
    return;
  }

  const file = fileInput.files[0];
  const formData = new FormData();
  formData.append('file', file);

  btn.disabled = true;
  status.textContent = `Ingesting ${file.name}...`;
  status.className = 'status pending';

  try {
    const res = await fetch(`${API_BASE}/ingest`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Ingest failed');

    status.textContent = `✓ ${data.source_name} — ${data.chunks_stored} chunks stored`;
    status.className = 'status ok';
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    status.className = 'status err';
  } finally {
    btn.disabled = false;
  }
}

async function query() {
  const input = document.getElementById('queryInput');
  const btn = document.getElementById('queryBtn');
  const log = document.getElementById('chatLog');
  const q = input.value.trim();
  if (!q) return;

  const emptyState = document.getElementById('emptyState');
  if (emptyState) emptyState.remove();

  log.insertAdjacentHTML('beforeend', `<div class="msg-row user"><div class="bubble">${escapeHtml(q)}</div></div>`);
  input.value = '';
  btn.disabled = true;

  const pendingId = 'pending-' + Date.now();
  log.insertAdjacentHTML('beforeend',
    `<div class="msg-row answer" id="${pendingId}"><div class="bubble dot-typing"><span></span><span></span><span></span></div></div>`);
  log.scrollTop = log.scrollHeight;

  try {
    const res = await fetch(`${API_BASE}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Query failed');

    const sourcesHtml = data.sources && data.sources.length
      ? `<div class="sources">Sources: ${data.sources.map(escapeHtml).join(', ')}</div>`
      : '';

    document.getElementById(pendingId).innerHTML = `<div class="bubble">${escapeHtml(data.answer)}${sourcesHtml}</div>`;
  } catch (err) {
    document.getElementById(pendingId).innerHTML = `<div class="bubble">Error: ${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false;
    log.scrollTop = log.scrollHeight;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
